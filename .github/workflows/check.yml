name: check
on: [push, pull_request]
jobs:
  # Обязательные проверки: конфиг, сцены, сюжет, CG. Без сети и без браузера.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Линтер сцен
        run: node tools/lint_scenes.mjs --quiet
      - name: Сюжетные прогоны
        run: node tools/story_test.mjs
      - name: Сюжетные прогоны Главы 2
        run: node tools/story_test_ch2.mjs
      - name: CG и достижимость шагов
        run: node tools/cg_test.mjs

  # Движок в настоящем браузере. Отдельная job: если CDN Playwright недоступен,
  # это видно по ней, но не блокирует остальные проверки и сборку релиза.
  smoke:
    # ubuntu-latest с 19.10.2026 — это Ubuntu 26, на нём playwright 1.56 не ставит Chromium.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости
        run: npm ci --no-audit --no-fund
      - name: Chromium для смоук-теста
        run: npx playwright install chromium
      - name: Смоук-тест движка
        run: node tools/smoke_test.mjs
