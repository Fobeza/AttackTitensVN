name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Линтер сцен
        run: node tools/lint_scenes.mjs --quiet
      - name: Сюжетные прогоны
        run: node tools/story_test.mjs
      - name: Сюжетные прогоны Главы 2
        run: node tools/story_test_ch2.mjs
      - name: CG и достижимость шагов
        run: node tools/cg_test.mjs
      - name: Зависимости
        run: npm ci --no-audit --no-fund
      - name: Chromium для смоук-теста
        run: npx playwright install --with-deps chromium
      - name: Смоук-тест движка
        run: node tools/smoke_test.mjs
